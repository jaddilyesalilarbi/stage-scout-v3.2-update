name: Enrich existing jobs

on:
  workflow_dispatch:
    inputs:
      max_seconds:
        description: Maximum collection duration (seconds)
        type: number
        default: 900
      retry_completed:
        description: Also recheck completed or expired postings
        type: boolean
        default: false

permissions:
  contents: write

# Share the existing scan lock: the daily CSV and dashboard cannot be published
# concurrently by this workflow and the daily/company/dashboard jobs.
concurrency:
  group: daily-stage-scout
  cancel-in-progress: false

jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install and test
        run: |
          python -m pip install -r requirements.txt
          python -m unittest discover -s tests -v
      - name: Resume historical enrichment
        id: enrich
        timeout-minutes: 20
        env:
          BACKFILL_SECONDS: ${{ inputs.max_seconds }}
          RETRY_COMPLETED: ${{ inputs.retry_completed }}
        run: |
          args=()
          if [ "$RETRY_COMPLETED" = "true" ]; then args+=(--retry); fi
          python -u backfill_jobs.py --workers 4 --max-seconds "$BACKFILL_SECONDS" "${args[@]}"
      - name: Preserve checkpoints and exact CSV backups
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: job-enrichment-checkpoint-${{ github.run_id }}
          include-hidden-files: true
          retention-days: 30
          path: |
            .backfill-backups/
            data/job-enrichment-state.json
            data/job-enrichment-audit.csv
            data/job-enrichment-summary.json
      - name: Publish enrichment without replacing daily CSV data
        if: ${{ !cancelled() && steps.enrich.outcome != 'skipped' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/job-enrichment-state.json data/job-enrichment-audit.csv data/job-enrichment-summary.json
          if ! git diff --cached --quiet; then
            git commit -m "Enrich historical job content"
          fi
          git fetch origin main
          # A merge conflict fails the workflow before any push; the checkpoint
          # artifact remains downloadable. Never reset or force-push.
          git merge --no-edit origin/main
          python backfill_jobs.py --report-only
          python build_dashboard.py
          python -m unittest discover -s tests -v
          git add data/job-enrichment-audit.csv data/job-enrichment-summary.json dashboard/index.html
          if ! git diff --cached --quiet; then
            git commit -m "Refresh enriched dashboard from latest history"
          fi
          git push origin HEAD:main
